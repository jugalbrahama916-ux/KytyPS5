name: Build Jetsku + Upstream + Built-in DLSS

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Jetsku Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin Python 3.12 for Qt Installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge Latest Upstream KytyPS5 (DLSS + FSR + Latest Fixes)
        shell: pwsh
        run: |
          git config user.name "LocalBuilder"
          git config user.email "builder@local.dev"
          git remote add upstream https://github.com/KytyPS5/KytyPS5.git
          git fetch upstream main
          git merge upstream/main -X theirs --no-edit
          git submodule update --init --recursive

      - name: Patch Default DLSS Path to Executable Directory
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Include *.cpp,*.h | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match "nvngx_dlss\.dll") {
              $patched = $content -replace 'std::filesystem::path\s+dlss_dir\s*;', 'std::filesystem::path dlss_dir = ".";'
              Set-Content -Path $_.FullName -Value $patched -NoNewline
            }
          }

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2022_64'

      - name: Configure and Build with clang-cl
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          cmake --build build --config Release --parallel

      - name: Package Clean Release Folder with Bundled DLSS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\*.exe" -Destination "dist\" -Force -ErrorAction SilentlyContinue
          Copy-Item "build\*.dll" -Destination "dist\" -Force -ErrorAction SilentlyContinue
          if (Test-Path "u59-preset.json") { Copy-Item "u59-preset.json" -Destination "dist\" -Force }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NVIDIA/DLSS/v310.9.16/lib/Windows_x86_64/rel/nvngx_dlss.dll" -OutFile "dist\nvngx_dlss.dll"
          windeployqt "dist\launcher.exe" --no-translations --no-system-d3d-compiler --no-opengl-sw

      - name: Upload Ready-to-Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-U59-Latest-DLSS-Win64
          path: dist/
